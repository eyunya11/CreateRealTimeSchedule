name: build

# Builds the mod, runs the unit tests, and then runs the game tests on a Minecraft server that has
# Create loaded. It runs for every pull request into main and for every push to main.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to the same branch makes an older run on it pointless.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Build and test
    runs-on: ubuntu-latest
    # The first run on a cold cache downloads Minecraft, NeoForge and Create and builds Minecraft's
    # sources, which takes about ten minutes; later runs take the cache.
    timeout-minutes: 60

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Check the Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Compiles the mod and the game tests, runs the unit tests, and makes the jar.
      - name: Build and run the unit tests
        run: ./gradlew build --console=plain

      # Starts a Minecraft server with Create and the mod, runs the game tests on it, and stops.
      - name: Run the game tests
        run: ./gradlew runGameTestServer --console=plain

      - name: Keep the reports of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            build/reports/tests
            build/test-results
            run/logs
          if-no-files-found: ignore
          retention-days: 7
